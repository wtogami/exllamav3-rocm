# TabbyAPI: Qwen3.8-27B EXL3 3.5bpw on a 24 GB RDNA3 GPU (RX 7900 XTX)
# MTP drafting (head built into the model), full 262,144-token context, 8-bit KV cache
network:
  host: 0.0.0.0
  port: 8096
  # Keep auth on when the port is reachable from other machines; TabbyAPI writes api_tokens.yml on first start
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: models
  model_name: Qwen3.8-27B-EXL3-3.5bpw
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: 2048
  max_batch_size: 1
  vision: true
  vision_offload: true
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: mtp
  draft_cache_mode: Q8

sampling:
  # Fallback sampler parameters for requests that omit them. safe_defaults is llama.cpp-style
  # (temperature 0.8, top_k 40, top_p 0.95, min_p 0.05) and each value only applies when the
  # request does not set it. Presets live in TabbyAPI's sampler_overrides/ folder. With no
  # preset, omitted parameters run untruncated: temperature 1.0, top_k 0, top_p 1.0, min_p 0.
  override_preset: safe_defaults

memory:
  sysmem_recurrent_cache: 4096
